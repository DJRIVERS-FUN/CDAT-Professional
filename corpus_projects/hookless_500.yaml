project:
  name: Hookless Bicycle Rim Technology Corpus
  target_documents: 500
  language: en
  minimum_words: 250
  maximum_documents_per_domain: 25
  near_duplicate_threshold: 0.92
  search_results_per_query: 30
  output_directory: outputs/hookless_500

query_families:
  - 'hookless rim OR hookless rims'
  - 'hookless tyre OR hookless tire OR hookless wheel'
  - 'hookless safety OR compatibility OR pressure OR blowoff'
  - 'hookless testing OR engineering OR standard OR regulation'
  - 'hookless cycling experience OR incident OR UCI'

